[package]
name = "onboard"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Onboard desktop shell (Tauri) — sidecar supervision, IPC, settings, keychain"
repository = "https://github.com/onboard/onboard"
# Cargo auto-discovers every src/bin/*.rs as a [[bin]] target, and Tauri's
# bundler bundles the package's bin targets — so an auto-discovered developer
# tool becomes a file in a user's install without anyone deciding it should.
# That is how v0.1.0 shipped `onboard_engine_stub.exe` (a fixture-replaying
# fake engine) and `check_egress_chokepoint.exe` beside the real engine.
#
# Turning auto-discovery OFF makes the shipped set explicit: a new file under
# src/bin/ is inert until someone adds it below and chooses whether it ships.
autobins = false

[lib]
name = "onboard_lib"
path = "src/lib.rs"

# `dev-tools/` holds every binary that must never reach a user's install.
# Tauri's bundler bundles the BUNDLED PACKAGE's [[bin]] targets, so anything
# declared below ships. That is not a policy this file can opt out of:
# `required-features` was tried and does not work, because the bundler reads
# targets from cargo metadata whether or not cargo built them, and fails with
#
#   failed to bundle project when getting size of
#     target/release/check_egress_chokepoint.exe (os error 2)
#
# Being a workspace member rather than a target of this package is what
# actually excludes them, and it keeps their output paths identical.
[workspace]
members = ["dev-tools"]
# The compile-fail fixtures under `tests/fixtures/` are standalone crates that
# are SUPPOSED to fail to compile — each one proves a specific misuse is a
# compile error (E0451, E0277, E0308…). Introducing a workspace root above
# them made cargo reject them with "current package believes it's in a
# workspace when it's not", which is not the error those tests assert, so all
# nine failed rather than silently passing on the wrong failure.
#
# That is the compile-fail suite working exactly as designed: it checks the
# ERROR CODE, not merely that compilation failed. A test that accepted any
# failure would have gone green here and stopped proving anything.
exclude = ["tests/fixtures"]

# EXACTLY ONE [[bin]] — this is the shipped set, and
# `bundled_package_ships_exactly_one_binary` (tests/bundled_binaries.rs) reads
# cargo metadata and fails if a second one ever appears. Adding one is
# therefore a deliberate, visible change rather than the accident that put a
# fake engine in v0.1.0's installer.
[[bin]]
name = "onboard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.5", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3.6", default-features = false, features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
sha2 = "0.10"
regex = "1"
once_cell = "1"
thiserror = "2"
log = "0.4"
# THE ONLY HTTP CLIENT IN THE REPOSITORY (Section 4, Section 5, Section 12).
# `default-features = false` + explicit `rustls-tls` per Section 4: no
# platform-native TLS library, no default proxy/charset/http2 surface this
# module doesn't need. `blocking` keeps the sole egress chokepoint
# synchronous like the rest of this crate (no tokio runtime anywhere else
# in the tree) — reqwest's blocking client runs its own internal runtime
# privately, so nothing outside `ai/http.rs` needs to become async.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"

[lints.clippy]
too_many_arguments = "allow"
too_many_lines = "deny"
cognitive_complexity = "deny"
