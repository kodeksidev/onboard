[package]
name = "onboard"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Onboard desktop shell (Tauri) — sidecar supervision, IPC, settings, keychain"
repository = "https://github.com/onboard/onboard"

[lib]
name = "onboard_lib"
path = "src/lib.rs"

[[bin]]
name = "onboard"
path = "src/main.rs"

# Stub sidecar used ONLY by tests (Phase 6) until the real Phase 5 binary
# lands. It speaks the exact Section 7.3 newline-delimited JSON-RPC 2.0
# protocol over stdio and replays packages/contract/fixtures/sample-analysis.json,
# embedded at compile time via include_str! so it needs no runtime path
# resolution (see A22 — the dev path contains a space).
[[bin]]
name = "onboard_engine_stub"
path = "src/bin/onboard_engine_stub.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.5" }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3.6", default-features = false, features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
sha2 = "0.10"
regex = "1"
once_cell = "1"
thiserror = "2"
log = "0.4"
# THE ONLY HTTP CLIENT IN THE REPOSITORY (Section 4, Section 5, Section 12).
# `default-features = false` + explicit `rustls-tls` per Section 4: no
# platform-native TLS library, no default proxy/charset/http2 surface this
# module doesn't need. `blocking` keeps the sole egress chokepoint
# synchronous like the rest of this crate (no tokio runtime anywhere else
# in the tree) — reqwest's blocking client runs its own internal runtime
# privately, so nothing outside `ai/http.rs` needs to become async.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"

[lints.clippy]
too_many_arguments = "allow"
too_many_lines = "deny"
cognitive_complexity = "deny"
