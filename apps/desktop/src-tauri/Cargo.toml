[package]
name = "onboard"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Onboard desktop shell (Tauri) — sidecar supervision, IPC, settings, keychain"
repository = "https://github.com/onboard/onboard"
# Cargo auto-discovers every src/bin/*.rs as a [[bin]] target, and Tauri's
# bundler bundles the package's bin targets — so an auto-discovered developer
# tool becomes a file in a user's install without anyone deciding it should.
# That is how v0.1.0 shipped `onboard_engine_stub.exe` (a fixture-replaying
# fake engine) and `check_egress_chokepoint.exe` beside the real engine.
#
# Turning auto-discovery OFF makes the shipped set explicit: a new file under
# src/bin/ is inert until someone adds it below and chooses whether it ships.
autobins = false

[lib]
name = "onboard_lib"
path = "src/lib.rs"

# NOTE (2026-07-29): `required-features = ["dev-tools"]` was tried here and
# does NOT work, for a reason worth recording so it is not retried. Tauri's
# bundler enumerates the package's [[bin]] targets from cargo metadata, which
# lists a target whether or not its required-features are satisfied. Cargo
# then does not BUILD the gated binary, so the bundler fails outright:
#
#   failed to bundle project when getting size of
#     target/release/check_egress_chokepoint.exe:
#     The system cannot find the file specified. (os error 2)
#
# That error is also the proof of the harvest mechanism: the bundler went
# looking for a developer tool by name, which is exactly how v0.1.0 shipped
# `onboard_engine_stub.exe` beside the real engine. The fix is structural —
# these binaries must not be TARGETS OF THIS PACKAGE at all (a sibling crate
# sharing the target directory) — not a feature gate. Tracked separately.

[[bin]]
name = "onboard"
path = "src/main.rs"

# Stub sidecar used ONLY by tests (Phase 6) until the real Phase 5 binary
# lands. It speaks the exact Section 7.3 newline-delimited JSON-RPC 2.0
# protocol over stdio and replays packages/contract/fixtures/sample-analysis.json,
# embedded at compile time via include_str! so it needs no runtime path
# resolution (see A22 — the dev path contains a space).
#
# STILL SHIPS TO USERS — see the NOTE above. A fake engine sitting next to
# the real one in a user-writable directory is a substitution target on a
# product whose thesis is that nothing leaves the machine, and the
# set-equality assertion in `scripts/installed-app-check.py` fails on it by
# design until the structural fix lands.
[[bin]]
name = "onboard_engine_stub"
path = "src/bin/onboard_engine_stub.rs"

# Build-time source checker (Section 12's egress chokepoint). Run in CI as
# `cargo run --bin check_egress_chokepoint -- .`; it has no business in a
# shipped installer, and likewise still ships. See the NOTE above.
[[bin]]
name = "check_egress_chokepoint"
path = "src/bin/check_egress_chokepoint.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.5", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3.6", default-features = false, features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
sha2 = "0.10"
regex = "1"
once_cell = "1"
thiserror = "2"
log = "0.4"
# THE ONLY HTTP CLIENT IN THE REPOSITORY (Section 4, Section 5, Section 12).
# `default-features = false` + explicit `rustls-tls` per Section 4: no
# platform-native TLS library, no default proxy/charset/http2 surface this
# module doesn't need. `blocking` keeps the sole egress chokepoint
# synchronous like the rest of this crate (no tokio runtime anywhere else
# in the tree) — reqwest's blocking client runs its own internal runtime
# privately, so nothing outside `ai/http.rs` needs to become async.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"

[lints.clippy]
too_many_arguments = "allow"
too_many_lines = "deny"
cognitive_complexity = "deny"
