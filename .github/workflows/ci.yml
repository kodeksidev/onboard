name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Keep in lockstep with the "packageManager" pin in package.json.
  # Section 4 names Bun 1.2.x; we run 1.3.x — see docs/DECISIONS.md.
  BUN_VERSION: '1.3.14'

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Run verify (typecheck && lint && test)
        run: bun run verify

  verify-space-in-path:
    # Section 10 / known-hard-part (3) / acceptance criterion 1: the dev machine's
    # own path contains a space, and every script + spawn call must quote paths.
    # This job proves `bun install && bun run verify` also succeeds from a checkout
    # directory whose name itself contains a space.
    name: verify (path containing a space)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout into a directory whose name contains a space
        uses: actions/checkout@v4
        with:
          path: 'onboard checkout'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies (from a path containing a space)
        working-directory: 'onboard checkout'
        run: bun install

      - name: Run verify (from a path containing a space)
        working-directory: 'onboard checkout'
        run: bun run verify

  egress-chokepoint:
    # Section 12: "apps/desktop/src-tauri/src/ai/http.rs constructs the only
    # reqwest::Client in the repository." Phase 12 step 2 landed ai/http.rs,
    # so this is now the "exactly one file" check the earlier placeholder
    # asked for — implemented as a real, unit-tested program
    # (src-tauri/src/bin/check_egress_chokepoint.rs) rather than an inline
    # grep, so the check itself has test coverage (zero/one/two-match cases,
    # both directions) instead of being trusted on faith. See that file's
    # doc comment and docs/DECISIONS.md for the resolution of a conflict in
    # the original literal wording ("hyper/rustls appearing anywhere fails"
    # is unsatisfiable once reqwest exists at all, since reqwest depends on
    # both transitively).
    name: egress chokepoint (reqwest confined to exactly one door)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Run the checker's own unit tests (both directions, per fixture)
        run: cargo test --bin check_egress_chokepoint

      - name: Assert exactly one door and no banned HTTP/TLS crates
        run: cargo run --quiet --bin check_egress_chokepoint -- "$(pwd)"
