name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Keep in lockstep with the "packageManager" pin in package.json.
  # Section 4 names Bun 1.2.x; we run 1.3.x — see docs/DECISIONS.md.
  BUN_VERSION: '1.3.14'

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Run verify (typecheck && lint && test)
        run: bun run verify

  verify-space-in-path:
    # Section 10 / known-hard-part (3) / acceptance criterion 1: the dev machine's
    # own path contains a space, and every script + spawn call must quote paths.
    # This job proves `bun install && bun run verify` also succeeds from a checkout
    # directory whose name itself contains a space.
    name: verify (path containing a space)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout into a directory whose name contains a space
        uses: actions/checkout@v4
        with:
          path: 'onboard checkout'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies (from a path containing a space)
        working-directory: 'onboard checkout'
        run: bun install

      - name: Run verify (from a path containing a space)
        working-directory: 'onboard checkout'
        run: bun run verify

  egress-chokepoint:
    # Section 12: "apps/desktop/src-tauri/src/ai/http.rs constructs the only
    # reqwest::Client in the repository. Enforcement is three-layered: (1) a CI
    # grep asserts reqwest::Client and reqwest::get appear in exactly one file..."
    #
    # No Rust source exists yet (Phase 12 introduces src-tauri/src/ai/http.rs), so
    # this currently only asserts "at most one file" and therefore cannot fail
    # before Phase 12. TIGHTEN THIS to "exactly one file" once Phase 12 lands
    # ai/http.rs, per Section 12's enforcement requirement.
    name: egress chokepoint (reqwest confined to at most one file)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert reqwest::Client / reqwest::get appear in at most one file
        shell: bash
        run: |
          set -euo pipefail
          MATCHES="$(grep -rlE 'reqwest::Client|reqwest::get' --include='*.rs' . || true)"
          COUNT=0
          if [ -n "$MATCHES" ]; then
            COUNT="$(printf '%s\n' "$MATCHES" | wc -l | tr -d ' ')"
          fi
          if [ "$COUNT" -gt 1 ]; then
            echo "reqwest::Client / reqwest::get found in more than one file:"
            printf '%s\n' "$MATCHES"
            exit 1
          fi
          echo "OK: reqwest usage confined to at most one file ($COUNT match(es))."
