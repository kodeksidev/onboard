name: Release

# Phase 14. Per A3 and Section 3's third non-goal: UNSIGNED, ad-hoc installers.
# No code signing, no notarization, no stapling, no auto-update. The path out of
# that is documented in docs/SIGNING.md and deliberately not taken here.
#
# Builds every target. Publishes Windows and Linux. HOLDS macOS.
#
# The macOS hold is not caution, it is the absence of evidence: no macOS build
# has ever been executed on a Mac. This project has no Apple hardware, and a
# runner that can PRODUCE a darwin binary cannot RUN one — `build:sidecar`
# smoke-tests only the host binary, so on Linux the two darwin outputs are
# checked for format and size and nothing else. Publishing a `.dmg` whose engine
# has never started on the platform it targets would ship an assumption. The
# artefact is still built and uploaded to the workflow run, so whoever performs
# `docs/MACOS_SMOKE.md` has something to install.

# `workflow_dispatch` only registers from the DEFAULT BRANCH, so a release
# workflow cannot be dry-run before it is merged — `gh workflow run` answers
# "not found on the default branch". That would force this file's first real
# execution to be the release itself, which is the failure mode this project has
# spent a week removing.
#
# The `pull_request` trigger below is the answer, and it is permanent rather
# than scaffolding: the workflow that produces the artefacts users install
# should be exercised whenever it changes. The path filter keeps it off every
# unrelated PR, and the release-creation step is tag-gated, so a PR run builds
# every artefact and publishes nothing.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/release-assets-check.py'
      - 'scripts/sidecar-received-check.py'
      - 'packages/engine/scripts/build-sidecar.ts'
      - 'scripts/stage-sidecar.ts'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build every artefact but publish no release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  BUN_VERSION: '1.3.14'
  PYTHON_VERSION: '3.12'

jobs:
  sidecars:
    # ALL FOUR TRIPLES, ON LINUX, ONCE. `bun build --compile` cross-compiles
    # every target from a Linux runner and FAILS on Windows when extracting the
    # darwin bun executables ("Failed to extract executable for
    # 'bun-darwin-aarch64'"), measured across three consecutive runs. A9's "one
    # runner cross-compiles every target" holds on Linux only — see
    # docs/DECISIONS.md.
    #
    # So the sidecars are built here and passed to the bundle jobs as an
    # artifact. They are NOT rebuilt per runner: a Windows or macOS bundle job
    # rebuilding them would either fail (Windows) or reintroduce the assumption
    # that each runner produces identical bytes.
    name: engine sidecars (all four triples, Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Verifies each artefact's container format, declared architecture and a
      # size floor, and prints that the three non-host binaries are NOT
      # executed. See the doc comment on `verifyArtifact`.
      - name: Build all four sidecars
        run: bun run build:sidecar

      - name: Upload the sidecars
        uses: actions/upload-artifact@v4
        with:
          name: sidecars
          path: packages/engine/dist/onboard-engine-*
          retention-days: 7
          if-no-files-found: error

  bundle:
    name: bundle (${{ matrix.os }})
    needs: sidecars
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bundle formats are named per OS rather than left to Tauri's default
          # "everything this platform can make", because one of those formats
          # does not build here. `.deb` and `.rpm` bundle cleanly; `.AppImage`
          # fails on `linuxdeploy` even with libfuse2 installed and
          # APPIMAGE_EXTRACT_AND_RUN set. Section 13 #23 names `.AppImage`, so
          # dropping it is a recorded gap (docs/KNOWN_ISSUES.md), not a silent
          # narrowing — and shipping a format that has never been produced is
          # exactly what this release is avoiding for macOS.
          - os: ubuntu-22.04
            publish: true
            bundles: deb,rpm
          - os: windows-2022
            publish: true
            bundles: nsis,msi
          # Built so it exists for MACOS_SMOKE.md; `publish: false` keeps it out
          # of the release. See the header.
          - os: macos-14
            publish: false
            bundles: dmg,app
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Python (the received-sidecar check is a Python script)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # `libfuse2` is for the BUNDLER, not the app. Tauri's AppImage step shells
      # out to `linuxdeploy`, which is itself an AppImage and mounts via FUSE —
      # and a GitHub runner has no FUSE. Without it the build compiles cleanly
      # for six minutes and then dies on `failed to run linuxdeploy`, which
      # reads like a Tauri bug and is a missing system library.
      - name: Install Tauri's Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the sidecars built on Linux
        uses: actions/download-artifact@v4
        with:
          name: sidecars
          path: packages/engine/dist

      # `download-artifact` does not preserve the executable bit, and Tauri's
      # externalBin resolution needs it on Unix.
      - name: Restore the executable bit
        if: runner.os != 'Windows'
        run: chmod +x packages/engine/dist/onboard-engine-*

      # The claim Phase 14 rests on and that had never executed: the sidecars
      # built on Linux arrive INTACT and UNDER THEIR EXACT NAMES on a different
      # runner. `build:sidecar` verifies format and architecture where the files
      # are produced; this verifies identity and permissions where they are
      # consumed, which is a different claim. Expected names are derived from
      # build-sidecar.ts's own target table.
      - name: Assert the Linux-built sidecars arrived intact
        run: python scripts/sidecar-received-check.py

      - name: Stage the sidecar into the Tauri shell
        run: bun run stage:sidecar

      - name: Build the frontend bundle
        run: bun run --cwd "apps/desktop" build

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: release-cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      # No signing arguments anywhere, deliberately (A3). Tauri signs nothing it
      # is not given credentials for, and none are configured — so this produces
      # ad-hoc, unsigned installers by construction rather than by a flag
      # someone could flip.
      #
      # `tauri build` compiles the Rust binary and bundles it in one step; a
      # separate `cargo build --release` beforehand would just build it twice.
      - name: Build the unsigned installers
        working-directory: apps/desktop
        env:
          # Belt and braces with `libfuse2` above: if FUSE is still unavailable
          # (a container, a hardened runner), the AppImage tools extract
          # themselves instead of mounting. Without one of the two, the bundle
          # fails after the full Rust compile — the most expensive place to
          # discover a missing dependency.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bun run bundle -- --bundles ${{ matrix.bundles }}

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
          retention-days: 7
          if-no-files-found: error

  publish:
    # Windows and Linux only. `release-assets-check.py` asserts that mechanically
    # rather than trusting the glob below — a `.dmg` reaching this job would
    # otherwise be one careless pattern away from being published.
    name: publish (Windows + Linux only)
    needs: bundle
    # NO job-level `if`. The asset check must run on a workflow_dispatch dry run
    # too — it is the first thing that sees what the bundlers ACTUALLY produce,
    # including any format nobody anticipated, and gating the whole job behind
    # the tag would mean its first real execution is the release itself. Only
    # the final step is tag-gated.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (the asset check is a Python script)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download the Windows installers
        uses: actions/download-artifact@v4
        with:
          name: installers-windows-2022
          path: release-assets

      - name: Download the Linux installers
        uses: actions/download-artifact@v4
        with:
          name: installers-ubuntu-22.04
          path: release-assets

      - name: Assert no macOS artefact is about to be published
        run: python scripts/release-assets-check.py release-assets

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          draft: true
          generate_release_notes: true
          body: |
            **Unsigned build.** Windows SmartScreen will object; the exact steps
            are in [docs/INSTALL.md](docs/INSTALL.md). Code signing and
            notarization are out of scope for v1 — see
            [docs/SIGNING.md](docs/SIGNING.md).

            **macOS is not included in this release.** The build exists but has
            never been executed on a Mac, and publishing it would ship an
            assumption rather than a verified artefact. It is released once
            `docs/MACOS_SMOKE.md` is signed off on real hardware.

            What this release does not verify is listed under "What is not
            verified" in the README.
