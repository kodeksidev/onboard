name: Release

# Phase 14. Per A3 and Section 3's third non-goal: UNSIGNED, ad-hoc installers.
# No code signing, no notarization, no stapling, no auto-update. The path out of
# that is documented in docs/SIGNING.md and deliberately not taken here.
#
# Builds every target. Publishes Windows and Linux. HOLDS macOS.
#
# The macOS hold is not caution, it is the absence of evidence: no macOS build
# has ever been executed on a Mac. This project has no Apple hardware, and a
# runner that can PRODUCE a darwin binary cannot RUN one — `build:sidecar`
# smoke-tests only the host binary, so on Linux the two darwin outputs are
# checked for format and size and nothing else. Publishing a `.dmg` whose engine
# has never started on the platform it targets would ship an assumption. The
# artefact is still built and uploaded to the workflow run, so whoever performs
# `docs/MACOS_SMOKE.md` has something to install.

# `workflow_dispatch` only registers from the DEFAULT BRANCH, so a release
# workflow cannot be dry-run before it is merged — `gh workflow run` answers
# "not found on the default branch". That would force this file's first real
# execution to be the release itself, which is the failure mode this project has
# spent a week removing.
#
# The `pull_request` trigger below is the answer, and it is permanent rather
# than scaffolding: the workflow that produces the artefacts users install
# should be exercised whenever it changes. The path filter keeps it off every
# unrelated PR, and the release-creation step is tag-gated, so a PR run builds
# every artefact and publishes nothing.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/release-assets-check.py'
      # The install jobs' entire body. Without this a change to what
      # "installed correctly" MEANS would not run the jobs that assert it.
      - 'scripts/installed-app-check.py'
      - 'scripts/sidecar-received-check.py'
      - 'packages/engine/scripts/build-sidecar.ts'
      - 'scripts/stage-sidecar.ts'
      # Everything that decides WHAT A RELEASE CONTAINS or SAYS. These were
      # absent, and the absence had teeth: `release-formats.json` is the single
      # table driving the matrix, the upload glob and the asset check, and a
      # pull request editing it ran none of them. Nor did editing the release
      # notes, whose Downloads table is the body a reader actually clicks —
      # which is how that table came to list four downloads for three assets.
      - 'release-formats.json'
      - 'docs/RELEASE_NOTES_v*.md'
      - 'scripts/release-notes-check.py'
      - 'scripts/release-body-check.py'
      - 'scripts/release_notes_table.py'
      - 'scripts/release-plan.py'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build every artefact but publish no release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  BUN_VERSION: '1.3.14'
  PYTHON_VERSION: '3.12'

jobs:
  plan:
    # ONE table decides what ships. `release-formats.json` feeds this job, which
    # emits the bundle matrix and each platform's upload glob — and feeds
    # `release-assets-check.py`, which asserts the received set EQUALS the
    # expected set. Previously the matrix and the upload glob each decided and
    # disagreed: the matrix asked for deb+rpm, the glob had no *.rpm, and a dry
    # run went green staging three assets while the docs promised four.
    name: plan (read release-formats.json)
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      publisher: ${{ steps.publisher.outputs.publisher }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Derive the bundle matrix
        id: plan
        run: python scripts/release-plan.py --github

      # The single source of truth for what installed-windows and installed
      # (below) assert. Read here, not hardcoded in either job: two jobs each
      # deciding the expected publisher string is the same duplication that
      # let the bundle matrix and the upload glob disagree over *.rpm — one
      # of them gets edited and the other silently does not (docs/DECISIONS.md).
      - name: Read the expected publisher from tauri.conf.json
        id: publisher
        run: |
          publisher=$(jq -er '.bundle.publisher' apps/desktop/src-tauri/tauri.conf.json)
          echo "expected publisher: $publisher"
          echo "publisher=$publisher" >> "$GITHUB_OUTPUT"

  sidecars:
    # ALL FOUR TRIPLES, ON LINUX, ONCE. `bun build --compile` cross-compiles
    # every target from a Linux runner and FAILS on Windows when extracting the
    # darwin bun executables ("Failed to extract executable for
    # 'bun-darwin-aarch64'"), measured across three consecutive runs. A9's "one
    # runner cross-compiles every target" holds on Linux only — see
    # docs/DECISIONS.md.
    #
    # So the sidecars are built here and passed to the bundle jobs as an
    # artifact. They are NOT rebuilt per runner: a Windows or macOS bundle job
    # rebuilding them would either fail (Windows) or reintroduce the assumption
    # that each runner produces identical bytes.
    name: engine sidecars (all four triples, Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Verifies each artefact's container format, declared architecture and a
      # size floor, and prints that the three non-host binaries are NOT
      # executed. See the doc comment on `verifyArtifact`.
      - name: Build all four sidecars
        run: bun run build:sidecar

      - name: Upload the sidecars
        uses: actions/upload-artifact@v4
        with:
          name: sidecars
          path: packages/engine/dist/onboard-engine-*
          retention-days: 7
          if-no-files-found: error

  bundle:
    name: bundle (${{ matrix.os }})
    needs: [plan, sidecars]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Python (the received-sidecar check is a Python script)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # `libfuse2` is for the BUNDLER, not the app. Tauri's AppImage step shells
      # out to `linuxdeploy`, which is itself an AppImage and mounts via FUSE —
      # and a GitHub runner has no FUSE. Without it the build compiles cleanly
      # for six minutes and then dies on `failed to run linuxdeploy`, which
      # reads like a Tauri bug and is a missing system library.
      - name: Install Tauri's Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the sidecars built on Linux
        uses: actions/download-artifact@v4
        with:
          name: sidecars
          path: packages/engine/dist

      # `download-artifact` does not preserve the executable bit, and Tauri's
      # externalBin resolution needs it on Unix.
      - name: Restore the executable bit
        if: runner.os != 'Windows'
        run: chmod +x packages/engine/dist/onboard-engine-*

      # The claim Phase 14 rests on and that had never executed: the sidecars
      # built on Linux arrive INTACT and UNDER THEIR EXACT NAMES on a different
      # runner. `build:sidecar` verifies format and architecture where the files
      # are produced; this verifies identity and permissions where they are
      # consumed, which is a different claim. Expected names are derived from
      # build-sidecar.ts's own target table.
      - name: Assert the Linux-built sidecars arrived intact
        run: python scripts/sidecar-received-check.py

      - name: Stage the sidecar into the Tauri shell
        run: bun run stage:sidecar

      - name: Build the frontend bundle
        run: bun run --cwd "apps/desktop" build

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: release-cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      # No signing arguments anywhere, deliberately (A3). Tauri signs nothing it
      # is not given credentials for, and none are configured — so this produces
      # ad-hoc, unsigned installers by construction rather than by a flag
      # someone could flip.
      #
      # `tauri build` compiles the Rust binary and bundles it in one step; a
      # separate `cargo build --release` beforehand would just build it twice.
      - name: Build the unsigned installers
        working-directory: apps/desktop
        env:
          # Belt and braces with `libfuse2` above: if FUSE is still unavailable
          # (a container, a hardened runner), the AppImage tools extract
          # themselves instead of mounting. Without one of the two, the bundle
          # fails after the full Rust compile — the most expensive place to
          # discover a missing dependency.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bun run bundle -- --bundles ${{ matrix.bundles }}

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          # An extension list here is a SECOND place that decides what ships,
          # and it silently disagreed with the first: the matrix asked for
          # `deb,rpm`, Tauri built both, and this glob had no `*.rpm` — so the
          # dry run staged three assets while the docs promised four. Nothing
          # failed; the format just was not there.
          #
          # `release:check-assets` could not catch it either: it validates what
          # ARRIVES, and an asset that was never uploaded arrives as nothing.
          #
          # So this now uploads whatever the bundler produced and lets the
          # classifier be the single place that decides. An unrecognised
          # extension fails there by name rather than vanishing here.
          # Generated by `release:plan` from release-formats.json, so this
          # cannot disagree with the `--bundles` argument above — they are the
          # same table, read once.
          path: ${{ matrix.uploadGlob }}
          retention-days: 7
          if-no-files-found: error

  installed:
    # Criterion 23's second half, on the platform where it is reachable today.
    #
    # The criteria map recorded #23 as blocked because "launching the .dmg needs
    # a Mac". That was the wrong reason: no installer had been built ANYWHERE,
    # because @tauri-apps/cli was never a dependency. A criterion marked blocked
    # for reason X and actually blocked by Y is a status nobody re-examines.
    #
    # A fresh GitHub runner IS a clean machine — no repository checkout on the
    # PATH, no bun, no cargo, no node_modules. So this installs the .deb the way
    # a user would, with apt, and then asks the INSTALLED engine to analyse a
    # real repository over the same stdio RPC the app uses. That is a stronger
    # claim than "the process started": an app whose grammars did not ship would
    # start fine and analyse nothing.
    #
    # What is NOT covered, stated so the gap is not mistaken for coverage:
    # driving the window to a rendered graph needs the WebDriver harness, whose
    # fixed-port race makes it unfit as a gate (see ci.yml). Criterion 23's
    # "launch" is proven for the engine and unproven for the UI.
    name: installed .deb launches and analyses (clean runner)
    needs: [bundle, plan]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (for the check script only)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download the Linux installers
        uses: actions/download-artifact@v4
        with:
          name: installers-ubuntu-22.04
          path: installers

      # `apt-get install ./file.deb` resolves the package's own dependencies,
      # which `dpkg -i` does not. A user on Ubuntu gets this behaviour; a gate
      # that used dpkg would pass while a real install failed on a missing
      # webkit runtime.
      - name: Install the .deb the way a user would
        id: install_deb
        run: |
          sudo apt-get update
          # ABSOLUTE path. `apt-get install foo/bar.deb` treats the argument as a
          # PACKAGE NAME unless it starts with `./` or `/`, and fails with exit
          # 100 — which reads like an unmet dependency and is a path bug.
          DEB=$(find "$PWD/installers" -name '*.deb' | head -n 1)
          if [ -z "$DEB" ]; then
            echo "no .deb found in the downloaded artifact" >&2
            exit 1
          fi
          echo "installing $DEB"
          sudo apt-get install -y "$DEB"
          # Read the package's own name from the SAME file just installed,
          # rather than hardcode "onboard" as a guess at what the bundler
          # named it (Debian policy lowercases package names, which is why
          # this is not simply `productName`).
          PKG=$(dpkg-deb -f "$DEB" Package)
          echo "package=$PKG" >> "$GITHUB_OUTPUT"

      # Windows precedent for why this is an assertion, not a print: the
      # installed-windows job below used to only print Publisher=... and a
      # human happened to read it. Proven to discriminate before trusting it
      # (not assumed): `dpkg-query -W --showformat='${Maintainer}'` was tried
      # first and silently returns EMPTY for this field on this dpkg version
      # — a real gate-shaped bug that would have made this assertion compare
      # "" to "", passing on anything. `dpkg -s | grep | cut` was verified
      # against a real built-and-installed .deb to both correctly extract the
      # field AND correctly fail when handed a wrong expected value before
      # being written here.
      - name: Assert the installed .deb's Maintainer field
        run: |
          actual=$(dpkg -s "${{ steps.install_deb.outputs.package }}" | grep '^Maintainer:' | cut -d' ' -f2-)
          expected="${{ needs.plan.outputs.publisher }}"
          echo "Maintainer='$actual' (expected '$expected')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::installed .deb Maintainer='$actual', expected '$expected' — bundle.publisher regressed or was not rebuilt"
            exit 1
          fi

      # `.rpm` is built on this same runner (release-formats.json: deb+rpm)
      # but never installed anywhere in this workflow — there is no RPM-based
      # runner here to install it on. Read straight from the package FILE
      # instead (`rpm -qp` needs no install), which is still a real assertion
      # against real bundler output, not the "likely, unconfirmed" this
      # replaces (docs/DECISIONS.md, the publisher-rename AMENDMENT).
      - name: Assert the .rpm's Packager field
        run: |
          sudo apt-get install -y rpm
          RPM=$(find "$PWD/installers" -name '*.rpm' | head -n 1)
          if [ -z "$RPM" ]; then
            echo "no .rpm found in the downloaded artifact" >&2
            exit 1
          fi
          actual=$(rpm -qp --queryformat '%{PACKAGER}' "$RPM")
          expected="${{ needs.plan.outputs.publisher }}"
          echo "Packager='$actual' (expected '$expected')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::$RPM Packager='$actual', expected '$expected' — bundle.publisher regressed or was not rebuilt"
            exit 1
          fi

      # Xvfb, because the shell claim below starts a real window. Without a
      # display the process dies before it reaches sidecar resolution, which
      # would read as a resolution failure — a wrong finding, and a wrong
      # finding is worse than a missing one.
      - name: Start a virtual display
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x800x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # This job previously drove the ENGINE directly and never started the
      # shell, so it never called the shell's sidecar resolution — which is
      # why the packaging bug that broke the Windows .msi was latent here too
      # rather than caught. `--skip-shell` is deliberately NOT passed.
      - name: Assert the installed app starts, resolves its engine, and analyses
        run: python scripts/installed-app-check.py

  installed-windows:
    # Criterion 23's Windows half. This is the job whose absence let the
    # v0.1.0 .msi ship: the Linux job above proved layout and engine launch,
    # Windows had no equivalent, and the installer was published on the
    # strength of "it built".
    #
    # A fresh windows runner is clean in the way that matters here — no repo
    # checkout on the PATH, so the dev fallback that masked the bug on every
    # developer machine cannot resolve. Same reasoning that moved #23 from
    # machine-blocked to partially proven on Linux.
    # WHICH ARTEFACT THIS DRIVES, and why it changed. Until 2026-08-03 this job
    # installed the `.msi`, and that was the wrong target: the `.msi` is the
    # artefact NOBODY runs interactively, while `setup.exe` is the one the
    # product owner installs, the one every manual smoke observation was made
    # against, and — from this change on — the only Windows artefact published.
    # A gate pointed at the format users do not execute is a gate whose green
    # answers a question nobody asked.
    name: installed setup.exe starts, resolves its engine, and analyses (clean runner)
    needs: [bundle, plan]
    runs-on: windows-2022
    steps:
      - name: Checkout (for the check script only)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download the Windows installers
        uses: actions/download-artifact@v4
        with:
          name: installers-windows-2022
          path: installers

      # `/S` is NSIS's silent switch. Deliberately alone:
      #
      #   - NOT `/NS`, which suppresses shortcut creation. The Start Menu and
      #     desktop shortcuts are user-visible surfaces; a gate that skipped
      #     them would install something no user installs.
      #   - NOT `/R`, which runs the app afterwards. `installer.nsi` honours
      #     `/R` only in silent and passive mode, so passing it here would
      #     launch a second shell underneath the one the check starts itself,
      #     and the log assertion would be reading an unknown process's output.
      #   - NOT `/D=`, so the installer chooses its own default. That default
      #     IS the claim under test: `installMode` is `currentUser`, so this
      #     must land in %LOCALAPPDATA%\Onboard with no elevation. Forcing a
      #     directory would hide a regression to perMachine.
      #
      # `Start-Process -Wait` because NSIS returns control immediately
      # otherwise, and the next step would enumerate a half-written directory.
      - name: Install setup.exe the way a user would (silently)
        shell: pwsh
        run: |
          $setup = Get-ChildItem installers -Filter *-setup.exe -Recurse | Select-Object -First 1
          if (-not $setup) { Write-Error "no *-setup.exe in the downloaded artifact"; exit 1 }
          Write-Host "installing $($setup.FullName)"
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "install failed: $($p.ExitCode)"; exit 1 }
          Write-Host "installed, exit 0"

      # Enumeration moved AFTER the install, and that is a real change in what
      # is proven. The `.msi` could be read without installing (`msiexec /a`
      # extracts the file table), so the old job compared what the package
      # DECLARED against what it did. NSIS has no equivalent — an NSIS
      # installer is a program, not a manifest, and the only way to learn what
      # it writes is to let it write.
      #
      # Stated rather than glossed, because the two are not the same claim.
      # What is lost: the ability to see a declared-vs-actual divergence. What
      # is gained: this enumerates the bytes a user ends up with, which is the
      # claim criterion 23 is actually about.
      - name: Enumerate what actually landed in the install root
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'Onboard'
          if (-not (Test-Path $root)) {
            Write-Error "nothing at $root — a currentUser install did not land where it must"
            exit 1
          }
          Write-Host "=== files under $root ==="
          Get-ChildItem -Recurse -File $root |
            ForEach-Object { $_.FullName.Substring($root.Length).TrimStart('\') } |
            Sort-Object

      # The per-user install is itself an assertion now, not an incidental. It
      # is the single capability that decided the format question on
      # 2026-08-03 (see the AMENDMENT in docs/DECISIONS.md), so a silent
      # regression to perMachine — a stray `installMode` edit, a Tauri default
      # change — must fail here rather than be discovered by a user without
      # local administrator rights who cannot install at all.
      - name: Assert the install is per-user, not per-machine
        shell: pwsh
        run: |
          $perUser = Join-Path $env:LOCALAPPDATA 'Onboard\onboard.exe'
          $perMachine = Join-Path $env:ProgramFiles 'Onboard\onboard.exe'
          if (-not (Test-Path $perUser)) { Write-Error "not installed per-user: $perUser is missing"; exit 1 }
          if (Test-Path $perMachine) { Write-Error "installed PER-MACHINE at $perMachine — installMode regressed"; exit 1 }
          $key = Get-ChildItem 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall' |
            ForEach-Object { Get-ItemProperty $_.PSPath } |
            Where-Object { $_.DisplayName -eq 'Onboard' }
          if (-not $key) { Write-Error "no HKCU uninstall entry — Add/Remove Programs would not list Onboard"; exit 1 }
          Write-Host "per-user OK: $perUser"
          Write-Host "  Add/Remove Programs -> Publisher='$($key.Publisher)' Version='$($key.DisplayVersion)'"
          # This line used to only PRINT the publisher — it read Publisher='onboard'
          # (the identifier-derived default, before bundle.publisher was set at all)
          # from a real install, and that printed line was what caught the default
          # before anyone claimed it was fixed (docs/DECISIONS.md's AMENDMENT).
          # A print a human happens to read is not a gate: it would not have failed
          # a build that silently reverted. Asserted now, against the CURRENT
          # bundle.publisher — read from tauri.conf.json by the `plan` job
          # (docs/DECISIONS.md), not hardcoded here a second time: two places
          # deciding the same expected string is the *.rpm upload-glob gap
          # again, just in a different config.
          $expectedPublisher = '${{ needs.plan.outputs.publisher }}'
          if ($key.Publisher -ne $expectedPublisher) {
            Write-Error "Add/Remove Programs Publisher='$($key.Publisher)', expected '$expectedPublisher' — bundle.publisher regressed or was not rebuilt"
            exit 1
          }

      # Asserts the shipped `*.exe` set by SET EQUALITY, not presence — which is
      # what catches `onboard_engine_stub.exe` shipping beside the real engine.
      # It would also have printed the sidecar's real installed location on day
      # one, which is the single fact that would have prevented the bug.
      #
      # SCOPE, because the unqualified wording here was quoted as "the installed
      # layout is asserted by set equality on both platforms" and that is false:
      # this covers `*.exe` in the install root ONLY, and the Linux job's
      # equivalent step is a two-name banned-list scan, not set equality at all.
      # Non-executables — icons, grammars, DLLs — are asserted on neither.
      # Real set equality is queued; see docs/SESSION_HANDOFF.md.
      - name: Assert the installed app starts, resolves its engine, and analyses
        shell: pwsh
        run: python scripts/installed-app-check.py

  publish:
    # Windows and Linux only. `release-assets-check.py` asserts that mechanically
    # rather than trusting the glob below — a `.dmg` reaching this job would
    # otherwise be one careless pattern away from being published.
    name: publish (Windows + Linux only)
    # THIS is the gap that let v0.1.0 ship a broken .msi. `publish` depended
    # only on `bundle`, so an installer that built was an installer that
    # shipped — the Linux `installed` job existed but gated nothing, and
    # Windows had no such job at all. Both are now prerequisites, on the two
    # platforms this workflow actually publishes. An installer that cannot
    # start and resolve its engine no longer reaches a release page.
    needs: [bundle, installed, installed-windows]
    # NO job-level `if`. The asset check must run on a workflow_dispatch dry run
    # too — it is the first thing that sees what the bundlers ACTUALLY produce,
    # including any format nobody anticipated, and gating the whole job behind
    # the tag would mean its first real execution is the release itself. Only
    # the final step is tag-gated.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (the asset check is a Python script)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download the Windows installers
        uses: actions/download-artifact@v4
        with:
          name: installers-windows-2022
          path: release-assets

      - name: Download the Linux installers
        uses: actions/download-artifact@v4
        with:
          name: installers-ubuntu-22.04
          path: release-assets

      - name: Assert no macOS artefact is about to be published
        run: python scripts/release-assets-check.py release-assets

      # Runs on EVERY release run, not only on tag pushes. A release whose
      # notes are a generated commit list, while a written notes file sits
      # unread in the repository, is two sources of truth with the wrong one
      # reaching users — the same shape as the `.rpm` the matrix asked for and
      # the upload glob never sent. This fails on a dry run, while it is cheap.
      - name: Assert the release notes for this version exist
        run: >
          python scripts/release-notes-check.py
          ${{ (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push') && format('--tag {0}', github.ref_name) || '' }}

      - name: Resolve the notes path for the body
        id: notes
        run: echo "path=$(python scripts/release-notes-check.py --emit-path)" >> "$GITHUB_OUTPUT"

      - name: Create the release
        id: release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          draft: true
          # `body_path`, NOT `generate_release_notes`. One place decides what
          # the notes say, it is reviewable in a pull request, and it is the
          # same text whether you read the release page or the repository.
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: false

      # Reads the created release BACK and compares it to the file that was
      # sent. Sending the right input and publishing the right output are
      # different claims, and only the second is the one a reader experiences.
      #
      # This is the only check here that cannot run on the pull-request path,
      # because the step above is skipped there — which makes it the one most
      # likely to be "verified" by opening the page and nodding. So it runs in
      # the job and fails the run.
      - name: Assert the published body IS the notes file
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python scripts/release-body-check.py
          --release-id "${{ steps.release.outputs.id }}"
          --repository "${{ github.repository }}"
          --notes "${{ steps.notes.outputs.path }}"
